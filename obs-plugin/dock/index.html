<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AppleLive</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="12" height="14" rx="3"/><path d="m15 10 6-4v12l-6-4"/></svg></div><div><h1>AppleLive</h1><p>把 OBS 画面送到 iPhone</p></div></header>
  <section class="status" aria-live="polite"><span id="light" class="light"></span><div><strong id="status">正在连接控制面板…</strong><p id="detail">请稍候</p></div></section>
  <form id="settings"><fieldset id="fields">
    <label for="connection_mode">连接方式</label><select id="connection_mode"><option value="usb">USB 数据线</option><option value="lan">同一局域网</option></select>
    <label for="quality">画质</label><select id="quality"><option value="smooth">流畅 · 540p</option><option value="standard">标准 · 720p</option><option value="high">高清 · 1080p</option></select>
    <label class="check"><span>传输电脑声音</span><input type="checkbox" id="computer_audio"></label>
  </fieldset></form>
  <p id="mode_hint" class="hint">USB：连接数据线，并在手机上信任此电脑。</p>
  <div id="address_box" class="address"><span>电脑局域网地址</span><strong id="addresses">正在读取…</strong></div>
  <div id="stream_box" class="address" hidden><span>标准拉流地址</span><strong id="stream_address"></strong><button id="copy_stream" type="button" class="secondary" title="复制拉流地址">复制地址</button></div>
  <p id="error" role="alert" hidden></p>
  <button id="toggle" type="button" disabled>正在准备…</button>
  <p id="settings_hint" class="hint center">设置自动保存</p>
  <button id="phone_plugin" type="button" class="secondary" disabled>安装手机插件</button>
  <dialog id="plugin_dialog" aria-labelledby="plugin_title">
    <div class="dialog_head"><h2 id="plugin_title">手机插件</h2><button id="close_plugin" type="button" aria-label="关闭" title="关闭">&#215;</button></div>
    <label for="plugin_host" id="plugin_host_label">电脑地址</label><select id="plugin_host"></select>
    <div class="qr_area"><img id="plugin_qr" alt="手机插件下载二维码" width="240" height="240" hidden><p id="plugin_message" role="status"></p></div>
    <a id="download_plugin" class="download_button" download>下载 .dylib</a>
  </dialog>
  <details><summary>连接和声音帮助</summary><p>局域网：手机与电脑连接同一路由器，可以连接电脑地址或在「检测」中填写拉流地址。</p><p>USB：打开已注入 AppleLive 的直播 App，连接并信任电脑。旧 deb 版使用已配对的 OpenSSH 通道。</p><p>声音：OBS 将声音「监听并输出」至 CABLE Input，电脑开启声音传输，手机打开「内录」。内录关闭手机麦克风，缺少源音频时保持静音。</p></details>
</main><script src="app.js"></script></body></html>
