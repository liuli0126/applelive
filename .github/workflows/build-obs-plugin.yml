name: Build AppleLive OBS plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop_sender/**"
      - "obs-plugin/**"
      - "ios-injector/**"
      - "ios-tweak/**"
      - "scripts/verify-injector-dylib.py"
      - "scripts/build-ios-ffmpeg.sh"
      - "scripts/relink-injector.sh"
      - ".github/workflows/build-ios-injector.yml"
      - "scripts/build-obs-plugin.ps1"
      - "scripts/build-native-windows.ps1"
      - "native-obs-usb/**"
      - ".github/workflows/build-obs-plugin.yml"

jobs:
  build-phone-plugin:
    uses: ./.github/workflows/build-ios-injector.yml
  build-windows:
    needs: build-phone-plugin
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r desktop_sender/requirements.txt pyinstaller

      - name: Verify protocol
        run: |
          python desktop_sender/protocol_test.py
          python desktop_sender/dock_test.py
          python desktop_sender/obs_websocket_test.py
          python desktop_sender/transport_test.py
          python desktop_sender/phone_plugin_test.py
          python desktop_sender/usb_direct_test.py

      - name: Build and test native USB components against OBS 30.2.3
        shell: pwsh
        run: |
          $obsArchive = Join-Path $env:RUNNER_TEMP 'obs.zip'
          Invoke-WebRequest 'https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Windows.zip' -OutFile $obsArchive
          $obsRoot = Join-Path $env:RUNNER_TEMP 'obs'
          Expand-Archive -LiteralPath $obsArchive -DestinationPath $obsRoot
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          ./scripts/build-native-windows.ps1 -ObsRoot $obsRoot
          python native-obs-usb/tests/relay_test.py

      - name: Download phone library
        uses: actions/download-artifact@v4
        with:
          name: AppleLive-Injector-iOS14
          path: obs-plugin/phone-plugin

      - name: Build portable plugin
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mediamtx.zip'
          Invoke-WebRequest 'https://github.com/bluenviron/mediamtx/releases/download/v1.18.1/mediamtx_v1.18.1_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7f06a10fe43d0d1d698d1cc2655def6d4a66be6db2f3e7910c0b8c9c60052a36') { throw 'MediaMTX checksum mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'mediamtx'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          Copy-Item -LiteralPath (Join-Path $directory 'mediamtx.exe'), (Join-Path $directory 'LICENSE') -Destination obs-plugin/server/
          choco install ffmpeg -y --no-progress
          $nativeFFmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $nativeFFmpeg) { throw 'FFmpeg executable not found' }
          $env:Path = "$($nativeFFmpeg.DirectoryName);$env:Path"
          python desktop_sender/stream_server_test.py
          python desktop_sender/tee_test.py
          ./scripts/build-obs-plugin.ps1

      - name: Upload OBS plugin
        uses: actions/upload-artifact@v4
        with:
          name: AppleLive-OBS-Windows
          path: artifacts/AppleLive-OBS-Windows.zip
          if-no-files-found: error
