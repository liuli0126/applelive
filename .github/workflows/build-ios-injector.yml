name: Build AppleLive injector dylib

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "ios-injector/**"
      - "ios-tweak/**"
      - "scripts/verify-injector-dylib.py"
      - "scripts/build-ios-ffmpeg.sh"
      - ".github/workflows/build-ios-injector.yml"

jobs:
  build-injector:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid make perl

      - name: Install Theos and SDKs
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Cache iOS FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/ios-ffmpeg
          key: ios-ffmpeg-6.1.2-arm64-arm64e-sdk16.5-${{ hashFiles('scripts/build-ios-ffmpeg.sh') }}

      - name: Build iOS media libraries
        run: bash scripts/build-ios-ffmpeg.sh

      - name: Save media libraries
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/ios-ffmpeg
          key: ios-ffmpeg-6.1.2-arm64-arm64e-sdk16.5-${{ hashFiles('scripts/build-ios-ffmpeg.sh') }}

      - name: Prepare audio binding library
        run: |
          mkdir -p .build/fishhook
          for file in fishhook.c fishhook.h LICENSE; do
            curl --retry 3 -fsSL "https://raw.githubusercontent.com/facebook/fishhook/aadc161ac3b80db07a9908851839a17ba63a9eb1/$file" -o ".build/fishhook/$file"
          done

      - name: Test media and microphone replacement
        run: |
          FF=.build/ios-ffmpeg/host
          xcrun clang -fobjc-arc -Iios-injector -Iios-tweak -I"$FF/include" \
            ios-injector/tests/media-test.m ios-injector/ALMediaPlayer.m \
            ios-injector/ALSampleAudio.m ios-tweak/ALAudioRing.m \
            -L"$FF/lib" -lavformat -lavcodec -lswresample -lswscale -lavutil -lz -lbz2 -liconv \
            -framework Foundation -framework QuartzCore -framework CoreVideo -framework CoreMedia \
            -framework VideoToolbox -framework AudioToolbox -framework Security -framework CoreFoundation \
            -o "$RUNNER_TEMP/applelive-media-test"
          "$RUNNER_TEMP/applelive-media-test" ios-injector/tests/fixture.mp4

      - name: Build injector dylib
        run: |
          mkdir -p injector-artifact
          mkdir -p relink/objects/arm64 relink/objects/arm64e
          make -C ios-injector all FINALPACKAGE=1 ARCHS=arm64 TARGET=iphone:clang:16.5:14.0
          cp ios-injector/.theos/obj/AppleLive.dylib "$RUNNER_TEMP/AppleLive-arm64.dylib"
          find ios-injector/.theos/obj -path '*/arm64/*' -name '*.o' -exec cp '{}' relink/objects/arm64/ \;
          make -C ios-injector all FINALPACKAGE=1 ARCHS=arm64e TARGET=iphone:clang:16.5:15.0
          find ios-injector/.theos/obj -path '*/arm64e/*' -name '*.o' -exec cp '{}' relink/objects/arm64e/ \;
          xcrun lipo -create "$RUNNER_TEMP/AppleLive-arm64.dylib" ios-injector/.theos/obj/AppleLive.dylib -output injector-artifact/AppleLive.dylib
          ldid -S injector-artifact/AppleLive.dylib
          cp .build/ios-ffmpeg/universal/FFmpeg-*.txt injector-artifact/
          cp .build/fishhook/LICENSE injector-artifact/fishhook-LICENSE.txt
          cp scripts/relink-injector.sh relink/
          cp -R .build/ios-ffmpeg/universal/lib .build/ios-ffmpeg/universal/include relink/
          cp .build/ios-ffmpeg/universal/FFmpeg-*.txt relink/
          cp -R .build/fishhook relink/
          tar --exclude=.git -czf relink/ffmpeg-source.tar.gz -C .build/ios-ffmpeg source
          mkdir -p relink/source
          git archive HEAD ios-injector ios-tweak scripts/build-ios-ffmpeg.sh | tar -x -C relink/source
          test "$(find relink/objects/arm64 -name '*.o' | wc -l)" -ge 12
          test "$(find relink/objects/arm64e -name '*.o' | wc -l)" -ge 12
          (cd relink && bash relink-injector.sh)
          python3 scripts/verify-injector-dylib.py relink/output/AppleLive.dylib
          rm -rf relink/output
          tar -czf injector-artifact/AppleLive-relink.tar.gz relink

      - name: Verify standalone binary
        run: |
          python3 scripts/verify-injector-dylib.py injector-artifact/AppleLive.dylib
          if xcrun nm -u injector-artifact/AppleLive.dylib | grep -E 'MSHook|ellekit|libhooker'; then
            exit 1
          fi
          shasum -a 256 injector-artifact/AppleLive.dylib > injector-artifact/SHA256.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AppleLive-Injector-iOS14
          path: injector-artifact/*
          if-no-files-found: error
